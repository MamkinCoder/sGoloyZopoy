<!doctype html>
<html>
<head><title>Карьера в КРОК</title></head>
<body>
<div class="vacancy__wrapper jsVacanciesWrapper">
<form>
    <select data-name="Направление" data-code="sectionsSelect" name="sections" id="sections" multiple>
        <option data-sort="0" value="8">
            Программная и вычислительная инфраструктура            </option>
        <option data-sort="1" value="11">
            Кибербезопасность            </option>
    </select>
    <select data-name="Город" data-code="CITYselect" name="CITY" id="CITY" multiple>
        <option data-sort="0" value="moscow">
            Москва            </option>
    </select>
</form>
<div class="vacancy__list-card mb-bigger mb-md-none jsVacanciesNotSorted jsVacanciesListValues">
    <div class="vacancy__card mb-bigger">
        <div class="vacancy__card-title b_b-grey_light pb-smallest mb-smallest">
            <h4 class="mr-smaller size-md-normal">Программная и вычислительная инфраструктура</h4>
            <div class="color-grey size-big size-md-normal">2</div>
        </div>
        <div>
            <div class="vacancy__card-item mb-smaller">
                <a class="size-normal size-md-smaller" target="_blank" href="/vacancies/senior-aqa-python/">
                    <span>Senior aQA-инженер Python</span>
                    <i class="icon-arrow-and_also color-green_croc"></i>
                    <ul class="size-smallest pl-none mb-smaller"><li class="bg-color-light_blue br-80 pl-smallest pr-smallest size-md-smallest">Более 6 лет</li></ul>
                </a>
            </div>
        </div>
    </div>
    <div class="vacancy__card mb-bigger">
        <div class="vacancy__card-title b_b-grey_light pb-smallest mb-smallest">
            <h4 class="mr-smaller size-md-normal">Кибербезопасность</h4>
            <div class="color-grey size-big size-md-normal">1</div>
        </div>
        <div>
            <div class="vacancy__card-item mb-smaller">
                <a class="size-normal size-md-smaller" target="_blank" href="/vacancies/analitik-ib/">
                    <span>Аналитик ИБ</span>
                    <i class="icon-arrow-and_also color-green_croc"></i>
                    <ul class="size-smallest pl-none mb-smaller"><li class="bg-color-light_blue br-80 pl-smallest pr-smallest size-md-smallest">3-6 лет</li></ul>
                </a>
            </div>
        </div>
    </div>
</div>
</div>
</body>
</html>
