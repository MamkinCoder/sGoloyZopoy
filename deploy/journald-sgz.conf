# Installed to /etc/systemd/journald.conf.d/sgz.conf by scripts/install-pi.sh.
# The journal on the Pi is persistent (/var/log/journal exists). sgz logs every run stage, so cap the
# journal to keep the SD card healthy. Applies to the whole journal, not just sgz.
# Read logs with:  journalctl -u sgz -f        journalctl -u sgz --since today
# No logrotate needed: sgz writes only to stdout/stderr -> journald.
[Journal]
SystemMaxUse=200M
SystemMaxFileSize=20M
MaxRetentionSec=1month
