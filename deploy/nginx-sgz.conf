# sGoloyZopoy panel behind the existing nginx on :80 (name-based vhosts, no catch-all).
# Installed by scripts/install-pi.sh to /etc/nginx/sites-available/sgz.conf (+ symlink in sites-enabled).
# Reachable as http://sgz.rp.i from the LAN once Pi-hole resolves sgz.rp.i -> the Pi.
# Over Tailscale use http://<tailscale-ip>:3002 directly (no Host header match here, and no catch-all).
server {
    listen 80;
    server_name sgz.rp.i;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (/api/runs/:id/events/stream): no buffering, long read timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
