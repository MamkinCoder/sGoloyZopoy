# Drop-in installed to /etc/systemd/system/unbound.service.d/oom-protect.conf by scripts/install-pi.sh.
# This box is the home gateway: the global OOM killer must never pick unbound over sgz.
# Takes effect on the next restart of unbound; install-pi.sh also applies it live via /proc/<pid>/oom_score_adj.
[Service]
OOMScoreAdjust=-900
