# Drop-in installed to /etc/systemd/system/pihole-FTL.service.d/oom-protect.conf by scripts/install-pi.sh.
# This box is the home gateway: the global OOM killer must never pick pihole-FTL over sgz.
# Takes effect on the next restart of pihole-FTL; install-pi.sh also applies it live via /proc/<pid>/oom_score_adj.
[Service]
OOMScoreAdjust=-900
